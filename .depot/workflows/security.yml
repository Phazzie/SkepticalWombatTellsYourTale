name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit (Node 20)
    runs-on: depot-ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skeptical_wombat?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Check Prisma formatting
        run: npx prisma format --check
      - name: Run npm audit
        run: npm audit --audit-level=high
